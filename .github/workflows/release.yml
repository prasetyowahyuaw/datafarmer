name: Release

# Creates a `vX.Y.Z` tag and GitHub Release whenever the version in
# pyproject.toml is bumped on main (e.g. the "[2.0.17] bump version" PRs).
# Nothing happens if the tag already exists.

on:
  push:
    branches: [main]
    paths: [pyproject.toml]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # No dependency cache here: on the "tag already exists" path uv is never
      # used, and the cache post-step then fails with "cache path does not exist".
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
          python-version: "3.12"

      - name: Read version
        id: version
        run: |
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if tag already exists
        id: check
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists, nothing to release."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run tests
        if: steps.check.outputs.exists == 'false'
        run: |
          uv sync --locked
          uv run pytest -q

      - name: Build package
        if: steps.check.outputs.exists == 'false'
        run: uv build

      - name: Create tag and GitHub release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes
